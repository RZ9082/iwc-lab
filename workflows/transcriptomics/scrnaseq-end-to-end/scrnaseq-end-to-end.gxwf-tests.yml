- doc: Test full single-cell RNA-seq end-to-end pipeline (STARsolo, AnnData, Seurat, SCE, MultiQC)
  job:
    reads:
      class: Collection
      collection_type: list:paired
      elements:
        - class: Collection
          collection_type: paired
          identifier: Sample_X
          elements:
            - identifier: forward
              class: File
              location: https://raw.githubusercontent.com/nf-core/test-datasets/scrnaseq/testdata/cellranger/Sample_X_S1_L001_R1_001.fastq.gz
              filetype: fastqsanger.gz
            - identifier: reverse
              class: File
              location: https://raw.githubusercontent.com/nf-core/test-datasets/scrnaseq/testdata/cellranger/Sample_X_S1_L001_R2_001.fastq.gz
              filetype: fastqsanger.gz
        - class: Collection
          collection_type: paired
          identifier: Sample_Y
          elements:
            - identifier: forward
              class: File
              location: https://raw.githubusercontent.com/nf-core/test-datasets/scrnaseq/testdata/cellranger/Sample_Y_S1_L001_R1_001.fastq.gz
              filetype: fastqsanger.gz
            - identifier: reverse
              class: File
              location: https://raw.githubusercontent.com/nf-core/test-datasets/scrnaseq/testdata/cellranger/Sample_Y_S1_L001_R2_001.fastq.gz
              filetype: fastqsanger.gz
    fasta:
      class: File
      location: https://github.com/nf-core/test-datasets/raw/scrnaseq/reference/GRCm38.p6.genome.chr19.fa
      filetype: fasta
    gtf:
      class: File
      location: https://github.com/nf-core/test-datasets/raw/scrnaseq/reference/gencode.vM19.annotation.chr19.gtf
      filetype: gtf
    barcode_whitelist:
      class: File
      location: https://raw.githubusercontent.com/nf-core/scrnaseq/master/assets/whitelist/10x_V2_barcode_whitelist.txt.gz
      decompress: true
      filetype: txt
    samplesheet:
      class: File
      location: https://raw.githubusercontent.com/nf-core/scrnaseq/master/assets/samplesheet.csv
      filetype: csv
  outputs:
    Filtered Gene Annotation GTF:
      asserts:
        has_text:
          text: "gene_id"
    Raw Gene Expression Matrix:
      element_tests:
        Sample_X:
          asserts:
            has_text:
              text: "%%MatrixMarket"
        Sample_Y:
          asserts:
            has_text:
              text: "%%MatrixMarket"
    Cell Barcodes:
      element_tests:
        Sample_X:
          asserts:
            has_n_lines:
              min: 100
        Sample_Y:
          asserts:
            has_n_lines:
              min: 100
    Gene Features:
      element_tests:
        Sample_X:
          asserts:
            has_text:
              text: "Gene Expression"
        Sample_Y:
          asserts:
            has_text:
              text: "Gene Expression"
    Filtered Gene Expression Matrix:
      element_tests:
        Sample_X:
          asserts:
            has_text:
              text: "%%MatrixMarket"
        Sample_Y:
          asserts:
            has_text:
              text: "%%MatrixMarket"
    Filtered Cell Barcodes:
      element_tests:
        Sample_X:
          asserts:
            has_n_lines:
              min: 100
        Sample_Y:
          asserts:
            has_n_lines:
              min: 100
    Filtered Gene Features:
      element_tests:
        Sample_X:
          asserts:
            has_text:
              text: "Gene Expression"
        Sample_Y:
          asserts:
            has_text:
              text: "Gene Expression"
    STARsolo Summary:
      element_tests:
        Sample_X:
          asserts:
            has_text:
              text: "Number of Reads"
        Sample_Y:
          asserts:
            has_text:
              text: "Number of Reads"
    FastQC Web Reports:
      element_tests:
        Sample_X:
          asserts:
            has_text:
              text: "FastQC"
        Sample_Y:
          asserts:
            has_text:
              text: "FastQC"
    Per-Sample Filtered AnnData Matrix:
      element_tests:
        Sample_X:
          asserts:
            has_size:
              min: 1000
        Sample_Y:
          asserts:
            has_size:
              min: 1000
    Combined Filtered AnnData Matrix:
      asserts:
        has_size:
          min: 1000
    Combined Seurat RDS Object:
      asserts:
        has_size:
          min: 1000
    Combined SingleCellExperiment RDS Object:
      asserts:
        has_size:
          min: 1000
    MultiQC Quality Report:
      asserts:
        has_text:
          text: "MultiQC"
