class: GalaxyWorkflow
label: 'nf-core/scrnaseq: Kallisto-Bustools'
doc: Build reference index and quantify single-cell RNA-seq FASTQ reads using kallisto
  and bustools (kb-python)
release: 0.1.0
license: MIT
tags:
- single-cell
- transcriptomics
- nf-core
- nf-core/scrnaseq
creator:
- class: Organization
  name: nf-core
  url: https://nf-co.re
- class: Person
  name: Rand Zoabi
- class: Organization
  name: Intergalactic Workflow Commission
  url: https://galaxyproject.org/iwc
inputs:
  reads:
    type: data_collection
    collection_type: paired
    label: Paired Single-Cell Reads
    doc: Paired-end single-cell FASTQ reads (Read 1 barcode/UMI, Read 2 cDNA)
  fasta:
    type: data
    format: fasta
    label: Genome Reference FASTA
    doc: Reference genome FASTA sequence file
  gtf:
    type: data
    format: gtf
    label: Gene Annotation GTF
    doc: Gene annotation file in GTF format
  technology:
    type: text
    default: 10XV2
    label: Single-Cell Technology
    doc: Barcode chemistry (e.g. 10XV2, 10XV3, DROPSEQ)
  workflow_mode:
    type: text
    default: standard
    label: Workflow Mode
    doc: Kallisto quantification mode (standard, lamanno, nucleus)
outputs:
  Raw Gene Expression Matrix (MTX):
    outputSource: kb_count/raw_matrix
    label: Raw Gene Expression Matrix (MTX)
  Raw Cell Barcodes (TSV):
    outputSource: kb_count/raw_barcodes
    label: Raw Cell Barcodes (TSV)
  Raw Gene Features (TSV):
    outputSource: kb_count/raw_features
    label: Raw Gene Features (TSV)
  Kallisto Index (.idx):
    outputSource: kb_ref/index
    label: Kallisto Index (.idx)
  Transcript-to-Gene Mapping (t2g.txt):
    outputSource: kb_ref/t2g
    label: Transcript-to-Gene Mapping (t2g.txt)
steps:
- id: kb_ref
  label: kb_ref
  doc: Build kallisto index and transcript-to-gene mapping from genome FASTA and GTF
  run:
    class: GalaxyUserTool
    id: kb-ref
    version: 0.28.2
    name: Kallisto-Bustools Reference
    description: Generate kallisto index and transcript-to-gene mappings from genome
      FASTA and GTF
    container: quay.io/biocontainers/kb-python:0.28.2--pyhdfd78af_2
    shell_command: "set -euo pipefail\nkb ref \\\n  -i kb_ref_out.idx \\\n  -g t2g.txt\
      \ \\\n  -f1 cdna.fa \\\n  --workflow '$(inputs.workflow_mode || \"standard\"\
      )' \\\n  '$(inputs.fasta.path)' \\\n  '$(inputs.gtf.path)'\n"
    inputs:
    - name: fasta
      type: data
      format: fasta
      label: Genome Reference FASTA
    - name: gtf
      type: data
      format: gtf
      label: Gene Annotation GTF
    - name: workflow_mode
      type: text
      value: standard
      label: Workflow Mode (standard, lamanno, nucleus)
    outputs:
    - name: index
      type: data
      format: binary
      from_work_dir: kb_ref_out.idx
      label: Kallisto Index (.idx)
    - name: t2g
      type: data
      format: tabular
      from_work_dir: t2g.txt
      label: Transcript-to-Gene Mapping (t2g.txt)
    - name: cdna
      type: data
      format: fasta
      from_work_dir: cdna.fa
      label: Extracted cDNA FASTA
    help:
      format: markdown
      content: Builds a kallisto index and transcript-to-gene mapping (t2g) required
        for single-cell quantification with kb count.
  in:
    fasta: fasta
    gtf: gtf
    workflow_mode: workflow_mode
- id: kb_count
  label: kb_count
  doc: Quantify single-cell FASTQ reads against kallisto index
  run:
    class: GalaxyUserTool
    id: kb-count
    version: 0.28.2
    name: Kallisto-Bustools Count
    description: Quantify single-cell RNA-seq FASTQ reads using kallisto and bustools
    container: quay.io/biocontainers/kb-python:0.28.2--pyhdfd78af_2
    configfiles:
    - filename: params.json
      content: "{\n  \"reads\": $(JSON.stringify(inputs.reads)),\n  \"index\": $(JSON.stringify(inputs.index.path)),\n\
        \  \"t2g\": $(JSON.stringify(inputs.t2g.path)),\n  \"technology\": $(JSON.stringify(inputs.technology)),\n\
        \  \"workflow_mode\": $(JSON.stringify(inputs.workflow_mode))\n}\n"
    - filename: run_kb.py
      content: "import os\nimport sys\nimport json\nimport glob\nimport shutil\nimport\
        \ subprocess\n\nwith open(\"params.json\") as fh:\n    params = json.load(fh)\n\
        \nreads = params.get(\"reads\")\npaths = []\ndef find_paths(obj):\n    if\
        \ isinstance(obj, str):\n        if obj.startswith(\"/\") or \".dat\" in obj\
        \ or \"fastq\" in obj:\n            paths.append(obj)\n    elif isinstance(obj,\
        \ dict):\n        if \"forward\" in obj and \"reverse\" in obj:\n        \
        \    find_paths(obj[\"forward\"])\n            find_paths(obj[\"reverse\"\
        ])\n        elif \"1\" in obj and \"2\" in obj:\n            find_paths(obj[\"\
        1\"])\n            find_paths(obj[\"2\"])\n        elif \"path\" in obj and\
        \ isinstance(obj[\"path\"], str):\n            paths.append(obj[\"path\"])\n\
        \        else:\n            for k in sorted(obj.keys()):\n               \
        \ find_paths(obj[k])\n    elif isinstance(obj, list):\n        for v in obj:\n\
        \            find_paths(v)\nfind_paths(reads)\nfwd = paths[0] if len(paths)\
        \ > 0 else None\nrev = paths[1] if len(paths) > 1 else None\n\nif not fwd\
        \ or not rev:\n    print(f\"Error: Unable to identify forward and reverse\
        \ read paths from input: {reads}\", file=sys.stderr)\n    sys.exit(1)\n\n\
        idx = params[\"index\"]\nt2g = params[\"t2g\"]\ntech = params.get(\"technology\"\
        ) or \"10XV2\"\nwf = params.get(\"workflow_mode\") or \"standard\"\nslots\
        \ = os.environ.get(\"GALAXY_SLOTS\", \"4\")\n\ncmd = [\"kb\", \"count\", \"\
        -t\", str(slots), \"-i\", idx, \"-g\", t2g, \"-x\", tech, \"--workflow\",\
        \ wf, \"-o\", \"output_counts\", fwd, rev]\nprint(\"Running kb count:\", \"\
        \ \".join(cmd))\nres = subprocess.run(cmd)\nif res.returncode != 0:\n    sys.exit(res.returncode)\n\
        \nos.makedirs(\"out_solo/raw\", exist_ok=True)\nos.makedirs(\"out_solo/filtered\"\
        , exist_ok=True)\n\nfor pattern, dst in [\n    (\"output_counts/counts_unfiltered/*.mtx\"\
        , \"out_solo/raw/matrix.mtx\"),\n    (\"output_counts/counts_unfiltered/*.barcodes.txt\"\
        , \"out_solo/raw/barcodes.tsv\"),\n    (\"output_counts/counts_unfiltered/*.genes.txt\"\
        , \"out_solo/raw/features.tsv\"),\n    (\"output_counts/counts_filtered/*.mtx\"\
        , \"out_solo/filtered/matrix.mtx\"),\n    (\"output_counts/counts_filtered/*.barcodes.txt\"\
        , \"out_solo/filtered/barcodes.tsv\"),\n    (\"output_counts/counts_filtered/*.genes.txt\"\
        , \"out_solo/filtered/features.tsv\")\n]:\n    matches = glob.glob(pattern)\n\
        \    if matches:\n        shutil.copyfile(matches[0], dst)\n\n# Ensure filtered\
        \ outputs exist even if kb count ran in unfiltered-only mode or minimal test\
        \ data\nif not os.path.exists(\"out_solo/filtered/matrix.mtx\") and os.path.exists(\"\
        out_solo/raw/matrix.mtx\"):\n    shutil.copyfile(\"out_solo/raw/matrix.mtx\"\
        , \"out_solo/filtered/matrix.mtx\")\nif not os.path.exists(\"out_solo/filtered/barcodes.tsv\"\
        ) and os.path.exists(\"out_solo/raw/barcodes.tsv\"):\n    shutil.copyfile(\"\
        out_solo/raw/barcodes.tsv\", \"out_solo/filtered/barcodes.tsv\")\nif not os.path.exists(\"\
        out_solo/filtered/features.tsv\") and os.path.exists(\"out_solo/raw/features.tsv\"\
        ):\n    shutil.copyfile(\"out_solo/raw/features.tsv\", \"out_solo/filtered/features.tsv\"\
        )\n"
    shell_command: 'set -euo pipefail

      python3 run_kb.py

      '
    inputs:
    - name: reads
      type: data_collection
      collection_type: paired
      label: Paired Single-Cell Reads (Read 1 Barcode/UMI, Read 2 cDNA)
    - name: index
      type: data
      format: binary
      label: Kallisto Index (.idx)
    - name: t2g
      type: data
      format: tabular
      label: Transcript-to-Gene Mapping (t2g.txt)
    - name: technology
      type: text
      value: 10XV2
      label: Single-Cell Technology / Chemistry
    - name: workflow_mode
      type: text
      value: standard
      label: Workflow Mode
    outputs:
    - name: raw_matrix
      type: data
      format: mtx
      from_work_dir: out_solo/raw/matrix.mtx
      label: Raw Count Matrix (MTX)
    - name: raw_barcodes
      type: data
      format: tsv
      from_work_dir: out_solo/raw/barcodes.tsv
      label: Raw Cell Barcodes (TSV)
    - name: raw_features
      type: data
      format: tsv
      from_work_dir: out_solo/raw/features.tsv
      label: Raw Gene Features (TSV)
    - name: filtered_matrix
      type: data
      format: mtx
      from_work_dir: out_solo/filtered/matrix.mtx
      label: Filtered Count Matrix (MTX)
    - name: filtered_barcodes
      type: data
      format: tsv
      from_work_dir: out_solo/filtered/barcodes.tsv
      label: Filtered Cell Barcodes (TSV)
    - name: filtered_features
      type: data
      format: tsv
      from_work_dir: out_solo/filtered/features.tsv
      label: Filtered Gene Features (TSV)
    help:
      format: markdown
      content: 'Quantifies single-cell RNA-seq FASTQ reads into gene expression matrices
        using kb count.

        '
  in:
    reads: reads
    index: kb_ref/index
    t2g: kb_ref/t2g
    technology: technology
    workflow_mode: workflow_mode
