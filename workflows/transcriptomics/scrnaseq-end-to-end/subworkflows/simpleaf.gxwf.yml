class: GalaxyWorkflow
label: "nf-core/scrnaseq: Simpleaf (Alevin-fry)"
doc: "Build Piscem/Salmon index, quantify single-cell FASTQ reads with Alevin-fry via Simpleaf, and perform QCatch quality assessment"
release: "0.1.0"
license: MIT
tags:
  - single-cell
  - transcriptomics
  - nf-core
  - nf-core/scrnaseq
creator:
  - class: Organization
    name: "nf-core"
    url: "https://nf-co.re"
  - class: Person
    name: "Rand Zoabi"
  - class: Organization
    name: "Intergalactic Workflow Commission"
    url: "https://galaxyproject.org/iwc"
inputs:
  reads:
    type: data_collection
    collection_type: paired
    label: Paired Single-Cell Reads
    doc: Paired-end single-cell FASTQ reads
  fasta:
    type: data
    format: fasta
    label: Genome Reference FASTA
    doc: Reference genome FASTA sequence file
  gtf:
    type: data
    format: gtf
    label: Gene Annotation GTF
    doc: Gene annotation file in GTF format
  whitelist:
    type: data
    format: txt
    label: Barcode Whitelist
    doc: Whitelist of valid cell barcodes
  chemistry:
    type: text
    default: 10xv2
    label: Chemistry / Protocol
    doc: 10x Chromium chemistry (10xv2, 10xv3, dropseq)
  resolution:
    type: text
    default: cr-like
    label: UMI Resolution Strategy
    doc: UMI deduplication algorithm (cr-like, parsimony, trivial)
outputs:
  Simpleaf AnnData Matrix (H5AD):
    outputSource: simpleaf_quant/h5ad
    label: Simpleaf AnnData Matrix (H5AD)
  QCatch Filtered AnnData Matrix (H5AD):
    outputSource: qcatch/filtered_h5ad
    label: QCatch Filtered AnnData Matrix (H5AD)
  QCatch HTML Quality Report:
    outputSource: qcatch/report
    label: QCatch HTML Quality Report
  Simpleaf Index Archive (.tar.gz):
    outputSource: simpleaf_index/index_archive
    label: Simpleaf Index Archive (.tar.gz)
  Simpleaf Transcript-to-Gene Mapping (t2g.tsv):
    outputSource: simpleaf_index/t2g
    label: Simpleaf Transcript-to-Gene Mapping (t2g.tsv)
steps:
  - id: simpleaf_index
    label: simpleaf_index
    doc: Build Piscem / Salmon reference index and transcript-to-gene mapping
    run:
      class: GalaxyUserTool
      id: simpleaf-index
      version: "0.19.5"
      name: Simpleaf Index
      description: Build Piscem / Salmon reference index and transcript-to-gene mapping for single-cell quantification
      container: quay.io/biocontainers/simpleaf:0.19.5--ha6fb395_0
      shell_command: |
        set -euo pipefail
        export ALEVIN_FRY_HOME="$PWD/af_home"
        mkdir -p "$ALEVIN_FRY_HOME"
        simpleaf set-paths
        simpleaf index \
          --threads \${GALAXY_SLOTS:-4} \
          --fasta '$(inputs.fasta.path)' \
          --gtf '$(inputs.gtf.path)' \
          -o af_index
        
        tar -czf index.tar.gz -C af_index index ref
        cp af_index/ref/t2g_3col.tsv t2g.tsv 2>/dev/null || cp af_index/ref/t2g.tsv t2g.tsv 2>/dev/null || true
      inputs:
        - name: fasta
          type: data
          format: fasta
          label: Genome Reference FASTA
        - name: gtf
          type: data
          format: gtf
          label: Gene Annotation GTF
      outputs:
        - name: index_archive
          type: data
          format: tar
          from_work_dir: index.tar.gz
          label: Simpleaf Index Archive (.tar.gz)
        - name: t2g
          type: data
          format: tabular
          from_work_dir: t2g.tsv
          label: Simpleaf Transcript-to-Gene Mapping (t2g.tsv)
    in:
      fasta: fasta
      gtf: gtf

  - id: simpleaf_quant
    label: simpleaf_quant
    doc: Quantify single-cell FASTQ reads with simpleaf quant
    run:
      class: GalaxyUserTool
      id: simpleaf-quant
      version: "0.19.5"
      name: Simpleaf Quant
      description: Quantify single-cell RNA-seq FASTQ reads using piscem/salmon mapping and alevin-fry
      container: quay.io/biocontainers/simpleaf:0.19.5--ha6fb395_0
      configfiles:
        - filename: params.json
          content: |
            {
              "reads": $(JSON.stringify(inputs.reads)),
              "index_archive": $(JSON.stringify(inputs.index_archive.path)),
              "t2g": $(JSON.stringify(inputs.t2g.path)),
              "whitelist": $(JSON.stringify(inputs.whitelist.path)),
              "chemistry": $(JSON.stringify(inputs.chemistry)),
              "resolution": $(JSON.stringify(inputs.resolution))
            }
        - filename: run_simpleaf.py
          content: |
            import os
            import sys
            import json
            import glob
            import shutil
            import subprocess

            with open("params.json") as fh:
                params = json.load(fh)

            reads = params.get("reads")
            paths = []
            def find_paths(obj):
                if isinstance(obj, str):
                    if obj.startswith("/") or ".dat" in obj or "fastq" in obj:
                        paths.append(obj)
                elif isinstance(obj, dict):
                    if "forward" in obj and "reverse" in obj:
                        find_paths(obj["forward"])
                        find_paths(obj["reverse"])
                    elif "1" in obj and "2" in obj:
                        find_paths(obj["1"])
                        find_paths(obj["2"])
                    elif "path" in obj and isinstance(obj["path"], str):
                        paths.append(obj["path"])
                    else:
                        for k in sorted(obj.keys()):
                            find_paths(obj[k])
                elif isinstance(obj, list):
                    for v in obj:
                        find_paths(v)
            find_paths(reads)
            fwd = paths[0] if len(paths) > 0 else None
            rev = paths[1] if len(paths) > 1 else None

            if not fwd or not rev:
                print(f"Error: Unable to identify forward and reverse read paths from input: {reads}", file=sys.stderr)
                sys.exit(1)

            os.environ["ALEVIN_FRY_HOME"] = os.path.join(os.getcwd(), "af_home")
            os.makedirs(os.environ["ALEVIN_FRY_HOME"], exist_ok=True)
            subprocess.run(["simpleaf", "set-paths"], check=True)

            os.makedirs("af_index", exist_ok=True)
            subprocess.run(["tar", "-xzf", params["index_archive"], "-C", "af_index"], check=True)

            slots = os.environ.get("GALAXY_SLOTS", "4")
            chem = params.get("chemistry") or "10xv2"
            res_mode = params.get("resolution") or "cr-like"

            cmd = [
                "simpleaf", "quant",
                "--threads", str(slots),
                "--index", "af_index/index",
                "--t2g-map", params["t2g"],
                "--chemistry", chem,
                "--reads1", fwd,
                "--reads2", rev,
                "--unfiltered-pl", params["whitelist"],
                "--resolution", res_mode,
                "--anndata-out",
                "--output", "af_quant_out"
            ]
            print("Running simpleaf quant:", " ".join(cmd))
            res = subprocess.run(cmd)
            if res.returncode != 0:
                sys.exit(res.returncode)

            os.makedirs("out_quants", exist_ok=True)
            for p in glob.glob("af_quant_out/**/*.h5ad", recursive=True):
                shutil.copyfile(p, "out_quants/quants.h5ad")
                break
      shell_command: |
        set -euo pipefail
        python3 run_simpleaf.py
      inputs:
        - name: reads
          type: data_collection
          collection_type: paired
          label: Paired Single-Cell Reads
        - name: index_archive
          type: data
          format: tar
          label: Simpleaf Index Archive (.tar.gz)
        - name: t2g
          type: data
          format: tabular
          label: Simpleaf Transcript-to-Gene Mapping (t2g.tsv)
        - name: whitelist
          type: data
          format: txt
          label: Barcode Whitelist
        - name: chemistry
          type: text
          value: 10xv2
          label: Chemistry / Protocol
        - name: resolution
          type: text
          value: cr-like
          label: UMI Resolution Strategy
      outputs:
        - name: h5ad
          type: data
          format: h5ad
          from_work_dir: out_quants/quants.h5ad
          label: Simpleaf AnnData Matrix (H5AD)
    in:
      reads: reads
      index_archive: simpleaf_index/index_archive
      t2g: simpleaf_index/t2g
      whitelist: whitelist
      chemistry: chemistry
      resolution: resolution

  - id: qcatch
    label: qcatch
    doc: Evaluate quality metrics and filter empty droplets with QCatch
    run:
      class: GalaxyUserTool
      id: qcatch
      version: "0.2.14"
      name: QCatch Quality Assessment
      description: Quality assessment and empty droplet filtering for single-cell Alevin-fry quantifications
      container: quay.io/biocontainers/qcatch:0.2.14--pyhdfd78af_0
      shell_command: |
        set -euo pipefail
        qcatch \
          --input '$(inputs.h5ad.path)' \
          --output qcatch_out \
          --save_filtered_h5ad \
          --export_summary_table
      inputs:
        - name: h5ad
          type: data
          format: h5ad
          label: Simpleaf / Alevin-fry AnnData Output (H5AD)
      outputs:
        - name: report
          type: data
          format: html
          from_work_dir: qcatch_out/QCatch_report.html
          label: QCatch HTML Quality Report
        - name: filtered_h5ad
          type: data
          format: h5ad
          from_work_dir: qcatch_out/filtered_quants.h5ad
          label: QCatch Filtered AnnData Matrix (H5AD)
        - name: metrics
          type: data
          format: csv
          from_work_dir: qcatch_out/summary_table.csv
          label: QCatch Metrics Summary Table (CSV)
    in:
      h5ad: simpleaf_quant/h5ad
