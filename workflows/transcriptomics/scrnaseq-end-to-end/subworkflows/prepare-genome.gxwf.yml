class: GalaxyWorkflow
label: "nf-core/scrnaseq: Prepare Genome"
doc: "Prepare reference FASTA and GTF annotation for single-cell RNA-seq alignment by filtering GTF annotations to sequences present in the genome FASTA"
release: "0.1.0"
license: MIT
tags:
  - single-cell
  - transcriptomics
  - nf-core
  - nf-core/scrnaseq
creator:
  - class: Organization
    name: "nf-core"
    url: "https://nf-co.re"
  - class: Person
    name: "Rand Zoabi"
  - class: Organization
    name: "Intergalactic Workflow Commission"
    url: "https://galaxyproject.org/iwc"
inputs:
  genome_fasta:
    type: data
    format: fasta
    label: Reference Genome FASTA
    doc: Reference genome FASTA sequence file
  gtf:
    type: data
    format: gtf
    label: Gene Annotation GTF
    doc: Gene annotation file in GTF format
outputs:
  Filtered Gene Annotation GTF:
    outputSource: filter_gtf/filtered_gtf
    label: Filtered Gene Annotation GTF
  Reference Genome FASTA:
    outputSource: genome_fasta
    label: Reference Genome FASTA
steps:
  - id: filter_gtf
    label: filter_gtf
    doc: Filter GTF file to include only annotations on sequences present in reference FASTA
    run:
      class: GalaxyUserTool
      id: gtf-gene-filter
      version: "0.1.0"
      name: Filter GTF by Genome Sequences
      description: Filter GTF file to include only annotations on sequences present in reference FASTA
      container: python:3.11-slim
      configfiles:
        - filename: params.json
          content: |
            {"fasta": $(JSON.stringify(inputs.fasta.path)), "gtf": $(JSON.stringify(inputs.gtf.path))}
        - filename: filter_gtf.py
          content: |
            import json
            from itertools import groupby

            with open("params.json") as fh:
                params = json.load(fh)

            def is_header(line):
                return line.startswith(">")

            def extract_fasta_seq_names(fasta_name):
                with open(fasta_name) as fh:
                    faiter = (x[1] for x in groupby(fh, is_header))
                    for header in faiter:
                        line = next(header)
                        if is_header(line):
                            yield line[1:].strip().split()[0]

            seq_names = set(extract_fasta_seq_names(params["fasta"]))
            print(f"Extracted {len(seq_names)} sequence names from FASTA: {sorted(list(seq_names))[:10]}")

            kept = 0
            total = 0
            with open("filtered_genes.gtf", "w") as out_f, open(params["gtf"]) as in_f:
                for line in in_f:
                    if line.startswith("#"):
                        out_f.write(line)
                        continue
                    total += 1
                    seq_id = line.split("\t")[0]
                    if seq_id in seq_names:
                        kept += 1
                        out_f.write(line)

            print(f"Kept {kept} / {total} GTF lines matching reference genome sequences.")
      shell_command: python filter_gtf.py
      inputs:
        - name: fasta
          type: data
          format: fasta
          label: Reference Genome FASTA
        - name: gtf
          type: data
          format: gtf
          label: Gene Annotation GTF
      outputs:
        - name: filtered_gtf
          type: data
          format: gtf
          from_work_dir: filtered_genes.gtf
          label: Filtered Gene Annotation GTF
    in:
      fasta: genome_fasta
      gtf: gtf
