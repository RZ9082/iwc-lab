- doc: Test Simpleaf subworkflow
  job:
    reads:
      class: Collection
      collection_type: paired
      elements:
        - class: File
          identifier: forward
          location: https://github.com/nf-core/test-datasets/raw/scrnaseq/testdata/Sample_X/fastqs/Sample_X_1.fastq.gz
          filetype: fastqsanger.gz
        - class: File
          identifier: reverse
          location: https://github.com/nf-core/test-datasets/raw/scrnaseq/testdata/Sample_X/fastqs/Sample_X_2.fastq.gz
          filetype: fastqsanger.gz
    fasta:
      class: File
      location: https://github.com/nf-core/test-datasets/raw/scrnaseq/reference/GRCm38.p6.genome.chr19.fa
      filetype: fasta
    gtf:
      class: File
      location: https://github.com/nf-core/test-datasets/raw/scrnaseq/reference/gencode.vM19.annotation.chr19.gtf
      filetype: gtf
    whitelist:
      class: File
      location: https://github.com/nf-core/test-datasets/raw/scrnaseq/testdata/whitelist/10x_V2_barcode_whitelist.txt.gz
      filetype: txt
  outputs:
    Simpleaf AnnData Matrix (H5AD):
      asserts:
        has_size:
          min: 1000
    Simpleaf Index Archive (.tar.gz):
      asserts:
        has_size:
          min: 1000
    Simpleaf Transcript-to-Gene Mapping (t2g.tsv):
      asserts:
        has_n_lines:
          min: 1
