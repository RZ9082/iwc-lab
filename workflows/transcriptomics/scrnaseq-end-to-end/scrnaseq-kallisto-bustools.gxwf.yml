class: GalaxyWorkflow
label: 'Single-Cell RNA-Seq Pipeline: Kallisto-Bustools (AnnData, Seurat, SingleCellExperiment,
  MultiQC)'
doc: 'This workflow performs single-cell RNA-seq pseudoalignment and quantification
  using kallisto and bustools (kb-python),

  followed by AnnData generation, multi-sample concatenation, Seurat and SingleCellExperiment
  format conversion,

  and MultiQC reporting matching the kallisto branch of nf-core/scrnaseq.

  '
release: 0.1.0
license: MIT
tags:
- single-cell
- transcriptomics
- kallisto
- bustools
- anndata
- seurat
- nf-core
- nf-core/scrnaseq
creator:
- class: Organization
  name: nf-core
  url: https://nf-co.re/scrnaseq
- class: Person
  name: Rand Zoabi
  email: rand.zoabi@rz.uni-freiburg.de
- class: Organization
  name: Intergalactic Workflow Commission
  url: https://github.com/galaxyproject/iwc
inputs:
  reads:
    type: collection
    collection_type: list:paired
    format: fastqsanger.gz
    label: Paired-end single-cell RNA-seq reads
    doc: FASTQ collection containing cell barcode and UMI (Read 1) paired with cDNA
      read (Read 2)
  fasta:
    type: data
    format: fasta
    label: Reference genome FASTA
    doc: Reference genome sequence in FASTA format
  gtf:
    type: data
    format: gtf
    label: Reference gene annotation GTF
    doc: Reference gene annotation file in GTF format
  samplesheet:
    type: data
    format: csv,tabular,txt
    optional: true
    label: Sample metadata sheet
    doc: Optional samplesheet (CSV/TSV) containing sample metadata to merge into AnnData
outputs:
  Filtered Gene Annotation GTF:
    outputSource: filter_gtf/filtered_gtf
    label: Filtered Gene Annotation GTF
  Raw Gene Expression Matrix:
    outputSource: kb_count/raw_matrix
    label: Raw Gene Expression Matrix
  Raw Cell Barcodes:
    outputSource: kb_count/raw_barcodes
    label: Raw Cell Barcodes
  Raw Gene Features:
    outputSource: kb_count/raw_features
    label: Raw Gene Features
  FastQC Web Reports:
    outputSource: fastqc/html_file
    label: FastQC Web Reports
  Per-Sample Filtered AnnData Matrix:
    outputSource: mtx_to_h5ad/h5ad
    label: Per-Sample Filtered AnnData Matrix
  Combined Filtered AnnData Matrix:
    outputSource: concat_h5ad/combined_h5ad
    label: Combined Filtered AnnData Matrix
  Combined Seurat RDS Object:
    outputSource: anndatar_convert/seurat_rds
    label: Combined Seurat RDS Object
  Combined SingleCellExperiment RDS Object:
    outputSource: anndatar_convert/sce_rds
    label: Combined SingleCellExperiment RDS Object
  MultiQC Quality Report:
    outputSource: multiqc/html_report
    label: MultiQC Quality Report
steps:
- id: filter_gtf
  label: filter_gtf
  doc: Filter GTF file to include only annotations on sequences present in reference
    FASTA
  run:
    class: GalaxyUserTool
    id: gtf-gene-filter
    version: 0.1.0
    name: Filter GTF by Genome Sequences
    description: Filter GTF file to include only annotations on sequences present
      in reference FASTA
    container: quay.io/biocontainers/python:3.13
    configfiles:
    - filename: params.json
      content: '{"fasta": $(JSON.stringify(inputs.fasta.path)), "gtf": $(JSON.stringify(inputs.gtf.path))}

        '
    - filename: filter_gtf.py
      content: "import json\nfrom itertools import groupby\n\nwith open(\"params.json\"\
        ) as fh:\n    params = json.load(fh)\n\ndef is_header(line):\n    return line.startswith(\"\
        >\")\n\ndef extract_fasta_seq_names(fasta_name):\n    with open(fasta_name)\
        \ as fh:\n        faiter = (x[1] for x in groupby(fh, is_header))\n      \
        \  for header in faiter:\n            line = next(header)\n            if\
        \ is_header(line):\n                yield line[1:].strip().split()[0]\n\n\
        seq_names = set(extract_fasta_seq_names(params[\"fasta\"]))\nprint(f\"Extracted\
        \ {len(seq_names)} sequence names from FASTA: {sorted(list(seq_names))[:10]}\"\
        )\n\nkept = 0\ntotal = 0\nwith open(\"filtered_genes.gtf\", \"w\") as out_f,\
        \ open(params[\"gtf\"]) as in_f:\n    for line in in_f:\n        if line.startswith(\"\
        #\"):\n            out_f.write(line)\n            continue\n        total\
        \ += 1\n        seq_id = line.split(\"\\t\")[0]\n        if seq_id in seq_names:\n\
        \            kept += 1\n            out_f.write(line)\n\nprint(f\"Kept {kept}\
        \ / {total} GTF lines matching reference genome sequences.\")\n"
    shell_command: python filter_gtf.py
    inputs:
    - name: fasta
      type: data
      format: fasta
      label: Reference Genome FASTA
    - name: gtf
      type: data
      format: gtf
      label: Gene Annotation GTF
    outputs:
    - name: filtered_gtf
      type: data
      format: gtf
      from_work_dir: filtered_genes.gtf
      label: Filtered Gene Annotation GTF
    help:
      format: markdown
      content: 'Filters a GTF annotation file to retain only annotations for chromosomes
        or scaffolds

        present in the provided FASTA genome sequence.


        This matches the `GTF_GENE_FILTER` module in `nf-core/scrnaseq`.

        '
  in:
    fasta: fasta
    gtf: gtf
- id: fastqc
  label: fastqc
  doc: Initial sequence quality metrics using FastQC
  tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc/0.74+galaxy1
  tool_version: 0.74+galaxy1
  in:
    input_file: reads
- id: kb_ref
  label: kb_ref
  doc: Build kallisto index and transcript-to-gene mapping
  run:
    class: GalaxyUserTool
    id: kb-ref
    version: 0.28.2
    name: Kallisto-Bustools Reference
    description: Generate kallisto index and transcript-to-gene mappings from genome
      FASTA and GTF
    container: quay.io/biocontainers/kb-python:0.28.2--pyhdfd78af_2
    shell_command: "set -euo pipefail\nkb ref \\\n  -i kb_ref_out.idx \\\n  -g t2g.txt\
      \ \\\n  -f1 cdna.fa \\\n  --workflow '$(inputs.workflow_mode)' \\\n  '$(inputs.fasta.path)'\
      \ \\\n  '$(inputs.gtf.path)'\n"
    inputs:
    - name: fasta
      type: data
      format: fasta
      label: Genome Reference FASTA
    - name: gtf
      type: data
      format: gtf
      label: Gene Annotation GTF
    - name: workflow_mode
      type: select
      default: standard
      label: Workflow Mode
      options:
      - - Standard (mRNA expression)
        - standard
      - - Lamanno (RNA velocity)
        - lamanno
      - - Nucleus (Single-nuclei RNA-seq)
        - nucleus
    outputs:
    - name: index
      type: data
      format: binary
      from_work_dir: kb_ref_out.idx
      label: Kallisto Index (.idx)
    - name: t2g
      type: data
      format: tabular
      from_work_dir: t2g.txt
      label: Transcript-to-Gene Mapping (t2g.txt)
    - name: cdna
      type: data
      format: fasta
      from_work_dir: cdna.fa
      label: Extracted cDNA FASTA
    help: 'Builds a kallisto index and transcript-to-gene mapping (t2g) required for
      single-cell quantification with kb count.

      '
  in:
    fasta: fasta
    gtf: filter_gtf/filtered_gtf
- id: kb_count
  label: kb_count
  doc: Quantify single-cell FASTQ reads
  run:
    class: GalaxyUserTool
    id: kb-count
    version: 0.28.2
    name: Kallisto-Bustools Count
    description: Quantify single-cell RNA-seq FASTQ reads using kallisto and bustools
    container: quay.io/biocontainers/kb-python:0.28.2--pyhdfd78af_2
    configfiles:
    - filename: params.json
      content: "{\n  \"reads\": $(JSON.stringify(inputs.reads)),\n  \"index\": $(JSON.stringify(inputs.index.path)),\n\
        \  \"t2g\": $(JSON.stringify(inputs.t2g.path)),\n  \"technology\": $(JSON.stringify(inputs.technology)),\n\
        \  \"workflow_mode\": $(JSON.stringify(inputs.workflow_mode))\n}\n"
    - filename: run_kb.py
      content: "import os\nimport sys\nimport json\nimport glob\nimport shutil\nimport\
        \ subprocess\n\nwith open(\"params.json\") as fh:\n    params = json.load(fh)\n\
        \nreads = params.get(\"reads\")\npaths = []\ndef find_paths(obj):\n    if\
        \ isinstance(obj, str):\n        if obj.startswith(\"/\") or \".dat\" in obj\
        \ or \"fastq\" in obj:\n            paths.append(obj)\n    elif isinstance(obj,\
        \ dict):\n        if \"forward\" in obj and \"reverse\" in obj:\n        \
        \    find_paths(obj[\"forward\"])\n            find_paths(obj[\"reverse\"\
        ])\n        elif \"1\" in obj and \"2\" in obj:\n            find_paths(obj[\"\
        1\"])\n            find_paths(obj[\"2\"])\n        elif \"path\" in obj and\
        \ isinstance(obj[\"path\"], str):\n            paths.append(obj[\"path\"])\n\
        \        else:\n            for k in sorted(obj.keys()):\n               \
        \ find_paths(obj[k])\n    elif isinstance(obj, list):\n        for v in obj:\n\
        \            find_paths(v)\nfind_paths(reads)\nfwd = paths[0] if len(paths)\
        \ > 0 else None\nrev = paths[1] if len(paths) > 1 else None\n\nif not fwd\
        \ or not rev:\n    print(f\"Error: Unable to identify forward and reverse\
        \ read paths from input: {reads}\", file=sys.stderr)\n    sys.exit(1)\n\n\
        idx = params[\"index\"]\nt2g = params[\"t2g\"]\ntech = params.get(\"technology\"\
        ) or \"10XV2\"\nwf = params.get(\"workflow_mode\") or \"standard\"\nslots\
        \ = os.environ.get(\"GALAXY_SLOTS\", \"4\")\n\ncmd = [\"kb\", \"count\", \"\
        -t\", str(slots), \"-i\", idx, \"-g\", t2g, \"-x\", tech, \"--workflow\",\
        \ wf, \"-o\", \"output_counts\", fwd, rev]\nprint(\"Running kb count:\", \"\
        \ \".join(cmd))\nres = subprocess.run(cmd)\nif res.returncode != 0:\n    sys.exit(res.returncode)\n\
        \nos.makedirs(\"out_solo/raw\", exist_ok=True)\nos.makedirs(\"out_solo/filtered\"\
        , exist_ok=True)\n\nfor pattern, dst in [\n    (\"output_counts/counts_unfiltered/*.mtx\"\
        , \"out_solo/raw/matrix.mtx\"),\n    (\"output_counts/counts_unfiltered/*.barcodes.txt\"\
        , \"out_solo/raw/barcodes.tsv\"),\n    (\"output_counts/counts_unfiltered/*.genes.txt\"\
        , \"out_solo/raw/features.tsv\"),\n    (\"output_counts/counts_filtered/*.mtx\"\
        , \"out_solo/filtered/matrix.mtx\"),\n    (\"output_counts/counts_filtered/*.barcodes.txt\"\
        , \"out_solo/filtered/barcodes.tsv\"),\n    (\"output_counts/counts_filtered/*.genes.txt\"\
        , \"out_solo/filtered/features.tsv\")\n]:\n    matches = glob.glob(pattern)\n\
        \    if matches:\n        shutil.copyfile(matches[0], dst)\n\n# Ensure filtered\
        \ outputs exist even if kb count ran in unfiltered-only mode or minimal test\
        \ data\nif not os.path.exists(\"out_solo/filtered/matrix.mtx\") and os.path.exists(\"\
        out_solo/raw/matrix.mtx\"):\n    shutil.copyfile(\"out_solo/raw/matrix.mtx\"\
        , \"out_solo/filtered/matrix.mtx\")\nif not os.path.exists(\"out_solo/filtered/barcodes.tsv\"\
        ) and os.path.exists(\"out_solo/raw/barcodes.tsv\"):\n    shutil.copyfile(\"\
        out_solo/raw/barcodes.tsv\", \"out_solo/filtered/barcodes.tsv\")\nif not os.path.exists(\"\
        out_solo/filtered/features.tsv\") and os.path.exists(\"out_solo/raw/features.tsv\"\
        ):\n    shutil.copyfile(\"out_solo/raw/features.tsv\", \"out_solo/filtered/features.tsv\"\
        )\n"
    shell_command: 'set -euo pipefail

      python3 run_kb.py

      '
    inputs:
    - name: reads
      type: data_collection
      collection_type: paired
      label: Paired Single-Cell Reads (Read 1 Barcode/UMI, Read 2 cDNA)
    - name: index
      type: data
      format: binary
      label: Kallisto Index (.idx)
    - name: t2g
      type: data
      format: tabular
      label: Transcript-to-Gene Mapping (t2g.txt)
    - name: technology
      type: text
      value: 10XV2
      label: Single-Cell Technology / Chemistry
    - name: workflow_mode
      type: text
      value: standard
      label: Workflow Mode
    outputs:
    - name: raw_matrix
      type: data
      format: mtx
      from_work_dir: out_solo/raw/matrix.mtx
      label: Raw Count Matrix (MTX)
    - name: raw_barcodes
      type: data
      format: tsv
      from_work_dir: out_solo/raw/barcodes.tsv
      label: Raw Cell Barcodes (TSV)
    - name: raw_features
      type: data
      format: tsv
      from_work_dir: out_solo/raw/features.tsv
      label: Raw Gene Features (TSV)
    - name: filtered_matrix
      type: data
      format: mtx
      from_work_dir: out_solo/filtered/matrix.mtx
      label: Filtered Count Matrix (MTX)
      optional: true
    - name: filtered_barcodes
      type: data
      format: tsv
      from_work_dir: out_solo/filtered/barcodes.tsv
      label: Filtered Cell Barcodes (TSV)
      optional: true
    - name: filtered_features
      type: data
      format: tsv
      from_work_dir: out_solo/filtered/features.tsv
      label: Filtered Gene Features (TSV)
      optional: true
    help: 'Quantifies single-cell RNA-seq FASTQ reads into gene expression matrices
      using kb count.

      '
  in:
    reads: reads
    index: kb_ref/index
    t2g: kb_ref/t2g
- id: mtx_to_h5ad
  label: mtx_to_h5ad
  doc: Convert count matrices to AnnData H5AD format
  run:
    class: GalaxyUserTool
    id: mtx-to-h5ad
    version: 0.1.0
    name: Convert 10x MTX to AnnData H5AD
    description: Convert 10x Genomics MTX matrix, barcodes, and features into an AnnData
      H5AD object
    container: quay.io/biocontainers/scanpy:1.7.2--pyhdfd78af_0
    configfiles:
    - filename: params.json
      content: "{\n  \"matrix\": $(JSON.stringify(inputs.matrix.path)),\n  \"barcodes\"\
        : $(JSON.stringify(inputs.barcodes.path)),\n  \"features\": $(JSON.stringify(inputs.features.path)),\n\
        \  \"sample\": $(JSON.stringify(inputs.sample_name)),\n  \"input_type\": $(JSON.stringify(inputs.input_type))\n\
        }\n"
    - filename: convert.py
      content: "import os\nimport json\nimport gzip\nimport shutil\nimport scanpy\
        \ as sc\n\nwith open(\"params.json\") as fh:\n    params = json.load(fh)\n\
        \nsample = params.get(\"sample\") or \"sample\"\ninput_type = params.get(\"\
        input_type\") or \"filtered\"\n\nmtx_dir = \"solo_mtx_input\"\nos.makedirs(mtx_dir,\
        \ exist_ok=True)\n\ndef setup_input(src, base_name):\n    dest_gz = os.path.join(mtx_dir,\
        \ f\"{base_name}.gz\")\n    if os.path.exists(dest_gz):\n        os.remove(dest_gz)\n\
        \    with open(src, \"rb\") as f:\n        magic = f.read(2)\n    if magic\
        \ == b\"\\x1f\\x8b\":\n        os.symlink(os.path.abspath(src), dest_gz)\n\
        \    else:\n        with open(src, \"rb\") as f_in, gzip.open(dest_gz, \"\
        wb\") as f_out:\n            shutil.copyfileobj(f_in, f_out)\n\nsetup_input(params[\"\
        matrix\"], \"matrix.mtx\")\nsetup_input(params[\"barcodes\"], \"barcodes.tsv\"\
        )\n\nfeat_src = params[\"features\"]\nwith open(feat_src, \"rb\") as f:\n\
        \    is_gz = f.read(2) == b\"\\x1f\\x8b\"\nif is_gz:\n    with gzip.open(feat_src,\
        \ \"rt\") as f:\n        lines = f.readlines()\nelse:\n    with open(feat_src,\
        \ \"rt\") as f:\n        lines = f.readlines()\n\nfirst_cols = lines[0].strip().split(\"\
        \\t\") if lines else []\nif len(first_cols) == 1:\n    print(\"Detected 1-column\
        \ features list (Kallisto/Bustools). Formatting into 10x 3-column format.\"\
        )\n    temp_feat = \"features_3col.tsv\"\n    with open(temp_feat, \"w\")\
        \ as f_out:\n        for l in lines:\n            gid = l.strip()\n      \
        \      f_out.write(f\"{gid}\\t{gid}\\tGene Expression\\n\")\n    setup_input(temp_feat,\
        \ \"features.tsv\")\nelse:\n    setup_input(feat_src, \"features.tsv\")\n\n\
        print(f\"Reading 10x MTX from {mtx_dir} for sample {sample} ({input_type})...\"\
        )\nadata = sc.read_10x_mtx(mtx_dir)\nadata.obs[\"sample\"] = sample\nadata.layers[\"\
        count\"] = adata.X.copy()\n\nadata.var[\"gene_symbol\"] = adata.var.index\n\
        adata.var[\"gene_versions\"] = adata.var[\"gene_ids\"]\nadata.var.index =\
        \ adata.var[\"gene_versions\"].str.split(\".\").str[0].values\nadata.var_names_make_unique()\n\
        \nout_file = \"matrix.h5ad\"\nadata.write_h5ad(out_file)\nprint(f\"Successfully\
        \ wrote AnnData ({adata.n_obs} cells x {adata.n_vars} genes) to {out_file}\"\
        )\n"
    shell_command: python convert.py
    inputs:
    - name: matrix
      type: data
      format: mtx
      label: Count Matrix (MTX)
    - name: barcodes
      type: data
      format: tabular,txt
      label: Barcodes (TSV)
    - name: features
      type: data
      format: tabular,txt
      label: Features / Genes (TSV)
    - name: sample_name
      type: text
      value: sample
      label: Sample Identifier
    - name: input_type
      type: text
      value: filtered
      label: Matrix Type (raw or filtered)
    outputs:
    - name: h5ad
      type: data
      format: h5ad
      from_work_dir: matrix.h5ad
      label: AnnData Matrix (H5AD)
    help:
      format: markdown
      content: 'Converts 10x Genomics format MTX files (matrix.mtx, barcodes.tsv,
        features.tsv)

        into a standardized AnnData H5AD dataset.


        This tool matches the `MTX_TO_H5AD` module from `nf-core/scrnaseq`.

        '
  in:
    matrix: kb_count/raw_matrix
    barcodes: kb_count/raw_barcodes
    features: kb_count/raw_features
- id: multiqc
  label: multiqc
  doc: Aggregate quality metrics across tools into an interactive HTML report
  tool_id: toolshed.g2.bx.psu.edu/repos/iuc/multiqc/multiqc/1.35+galaxy4
  tool_version: 1.35+galaxy4
  tool_shed_repository:
    changeset_revision: 97255f6fdf7e
    name: multiqc
    owner: iuc
    tool_shed: toolshed.g2.bx.psu.edu
  in:
    results_0|software_cond|output_0|type|input: fastqc/text_file
  out:
    html_report: html_report
    stats: stats
  state:
    comment: ''
    export_plots: false
    flat: false
    results_0:
      software_cond:
        output_0:
          type:
            input:
              __class__: ConnectedValue
            type: fastqc_data
        software: fastqc
    title: nf-core/scrnaseq Quality Report
- id: concat_h5ad
  label: concat_h5ad
  doc: Concatenate per-sample H5AD objects into a single AnnData object and merge
    samplesheet metadata
  run:
    class: GalaxyUserTool
    id: concat-h5ad
    version: 0.1.0
    name: Concatenate AnnData H5AD Files
    description: Combine multiple per-sample AnnData H5AD files into a merged dataset
    container: quay.io/biocontainers/scanpy:1.7.2--pyhdfd78af_0
    configfiles:
    - filename: params.json
      content: "{\n  \"h5ads\": $(JSON.stringify((function() {\n    var files = inputs.h5ad_files;\n\
        \    if (files && files.elements) {\n      return files.elements.map(function(d)\
        \ {\n        return {path: d.path, name: d.element_identifier || d.basename\
        \ || \"sample\"};\n      });\n    } else if (Array.isArray(files)) {\n   \
        \   return files.map(function(d) {\n        return {path: d.path, name: d.name\
        \ || \"sample\"};\n      });\n    } else if (files && files.path) {\n    \
        \  return [{path: files.path, name: files.name || \"sample\"}];\n    } else\
        \ {\n      return [];\n    }\n  })())),\n  \"samplesheet\": $(JSON.stringify(inputs.samplesheet\
        \ ? inputs.samplesheet.path : null)),\n  \"input_type\": $(JSON.stringify(inputs.input_type\
        \ || \"filtered\"))\n}\n"
    - filename: concat.py
      content: "import os\nimport json\nfrom pathlib import Path\nimport pandas as\
        \ pd\nimport scanpy as sc\nimport anndata as ad\n\nwith open(\"params.json\"\
        ) as fh:\n    params = json.load(fh)\n\ninput_type = params.get(\"input_type\"\
        ) or \"filtered\"\nsamplesheet_path = params.get(\"samplesheet\")\n\ndict_of_h5ad\
        \ = {}\nfor item in params[\"h5ads\"]:\n    p = item[\"path\"]\n    adata_sub\
        \ = sc.read_h5ad(p)\n    # Infer sample name from adata.obs['sample'] or fallback\
        \ to item name\n    if \"sample\" in adata_sub.obs.columns and len(adata_sub.obs[\"\
        sample\"]) > 0:\n        sample_name = str(adata_sub.obs[\"sample\"].iloc[0])\n\
        \    else:\n        sample_name = os.path.splitext(os.path.basename(item.get(\"\
        name\") or \"sample\"))[0]\n    key = f\"{sample_name}_{input_type}\"\n  \
        \  dict_of_h5ad[key] = adata_sub\n\nprint(f\"Concatenating {len(dict_of_h5ad)}\
        \ AnnData datasets: {list(dict_of_h5ad.keys())}...\")\nadata = ad.concat(dict_of_h5ad,\
        \ label=\"sample\", merge=\"unique\", index_unique=\"_\")\n\nif samplesheet_path\
        \ and os.path.exists(samplesheet_path):\n    try:\n        sep = \",\" if\
        \ samplesheet_path.endswith(\".csv\") else \"\\t\"\n        df_samplesheet\
        \ = pd.read_csv(samplesheet_path, sep=sep)\n        if \"sample\" in df_samplesheet.columns:\n\
        \            df_samplesheet = df_samplesheet.groupby([\"sample\"]).agg(lambda\
        \ col: \",\".join(set(col.astype(str))))\n            adata.obs = adata.obs.join(df_samplesheet,\
        \ on=\"sample\", how=\"left\").astype(str)\n            print(\"Joined samplesheet\
        \ metadata into AnnData obs.\")\n    except Exception as e:\n        print(f\"\
        Warning: could not process samplesheet: {e}\")\n\nout_file = \"combined_matrix.h5ad\"\
        \nadata.write_h5ad(out_file)\nprint(f\"Successfully wrote combined AnnData\
        \ ({adata.n_obs} cells x {adata.n_vars} genes) to {out_file}\")\n"
    shell_command: python concat.py
    inputs:
    - name: h5ad_files
      type: data_collection
      collection_type: list
      label: AnnData H5AD Collection
    - name: samplesheet
      type: data
      format: csv,tabular,txt
      optional: true
      label: Sample Sheet (CSV/TSV, optional)
    - name: input_type
      type: text
      value: filtered
      label: Matrix Type (raw or filtered)
    outputs:
    - name: combined_h5ad
      type: data
      format: h5ad
      from_work_dir: combined_matrix.h5ad
      label: Combined AnnData Matrix (H5AD)
    help:
      format: markdown
      content: 'Concatenates multiple AnnData H5AD files into a single unified AnnData
        file,

        preserving unique cell barcodes and merging gene features.


        Matches the `CONCAT_H5AD` module from `nf-core/scrnaseq`.

        '
  in:
    h5ad_files: mtx_to_h5ad/h5ad
    samplesheet: samplesheet
- id: anndatar_convert
  label: anndatar_convert
  doc: Convert AnnData H5AD matrix into Seurat and SingleCellExperiment RDS formats
  run:
    class: GalaxyUserTool
    id: anndatar-convert
    version: 0.1.0
    name: Convert AnnData H5AD to Seurat and SingleCellExperiment
    description: Convert an AnnData H5AD object into Seurat and SingleCellExperiment
      RDS formats
    container: quay.io/biocontainers/mulled-v2-c89532d7d58608b69c1a896707ec4cf926b98182:f42f8452ef30fd9df25b4e403c103977bc4c90df-0
    configfiles:
    - filename: params.json
      content: '{"h5ad": $(JSON.stringify(inputs.h5ad.path))}

        '
    - filename: convert.R
      content: 'library(jsonlite)

        params <- fromJSON("params.json")

        input_path <- params$h5ad


        TMP_DIR <- Sys.getenv("TMPDIR", "/tmp")

        PYDIR <- file.path(TMP_DIR, paste0("pybin_", Sys.getpid()))

        dir.create(PYDIR, showWarnings = FALSE, recursive = TRUE)

        file.symlink(Sys.which("python"), file.path(PYDIR, "python"))

        Sys.setenv(RETICULATE_PYTHON = file.path(PYDIR, "python"))


        library(reticulate)

        library(sceasy)

        library(Seurat)

        library(SingleCellExperiment)


        cat("Reading and converting AnnData H5AD to Seurat from:", input_path, "\n")

        sceasy::convertFormat(input_path, from = "anndata", to = "seurat", outFile
        = "matrix.seurat.rds")

        cat("Saved matrix.seurat.rds\n")


        cat("Converting Seurat to SingleCellExperiment object...\n")

        srt <- readRDS("matrix.seurat.rds")

        sce <- as.SingleCellExperiment(srt)

        saveRDS(sce, file = "matrix.sce.rds")

        cat("Saved matrix.sce.rds\n")

        '
    shell_command: Rscript convert.R
    inputs:
    - name: h5ad
      type: data
      format: h5ad
      label: AnnData Input Matrix (H5AD)
    outputs:
    - name: seurat_rds
      type: data
      format: rds
      from_work_dir: matrix.seurat.rds
      label: Seurat RDS Object
    - name: sce_rds
      type: data
      format: rds
      from_work_dir: matrix.sce.rds
      label: SingleCellExperiment RDS Object
    help:
      format: markdown
      content: 'Converts an AnnData (H5AD) single-cell matrix into Seurat RDS and
        SingleCellExperiment RDS

        formats for downstream analysis in R.


        Matches the `ANNDATAR_CONVERT` module from `nf-core/scrnaseq`.

        '
  in:
    h5ad: concat_h5ad/combined_h5ad
