class: GalaxyWorkflow
label: 'Single-Cell RNA-Seq Pipeline: STARsolo with CellBender Ambient RNA Removal'
doc: 'This workflow performs single-cell RNA-seq alignment with STARsolo, followed
  by CellBender deep generative

  ambient RNA and empty droplet removal, AnnData concatenation, Seurat and SingleCellExperiment
  conversion,

  and MultiQC reporting matching the complete CellBender branch of nf-core/scrnaseq.

  '
release: 0.1.0
license: MIT
tags:
- single-cell
- transcriptomics
- star
- cellbender
- anndata
- seurat
- nf-core
- nf-core/scrnaseq
creator:
- class: Organization
  name: nf-core
  url: https://nf-co.re/scrnaseq
- class: Person
  name: Rand Zoabi
  email: rand.zoabi@rz.uni-freiburg.de
- class: Organization
  name: Intergalactic Workflow Commission
  url: https://github.com/galaxyproject/iwc
inputs:
  reads:
    type: collection
    collection_type: list:paired
    format: fastqsanger.gz
    label: Paired-end single-cell RNA-seq reads
    doc: FASTQ collection containing cell barcode and UMI (Read 1) paired with cDNA
      read (Read 2)
  fasta:
    type: data
    format: fasta
    label: Reference genome FASTA
    doc: Reference genome sequence in FASTA format
  gtf:
    type: data
    format: gtf
    label: Reference gene annotation GTF
    doc: Reference gene annotation file in GTF format
  barcode_whitelist:
    type: data
    format: txt
    optional: true
    label: Cell barcode whitelist
    doc: Whitelist of known cell barcodes for error correction (optional)
  samplesheet:
    type: data
    format: csv,tabular,txt
    optional: true
    label: Sample metadata sheet
    doc: Optional samplesheet (CSV/TSV) containing sample metadata to merge into AnnData
outputs:
  Filtered Gene Annotation GTF:
    outputSource: filter_gtf/filtered_gtf
    label: Filtered Gene Annotation GTF
  Raw Gene Expression Matrix:
    outputSource: starsolo/output_matrix
    label: Raw Gene Expression Matrix
  Cell Barcodes:
    outputSource: starsolo/output_barcodes
    label: Cell Barcodes
  Gene Features:
    outputSource: starsolo/output_genes
    label: Gene Features
  Filtered Gene Expression Matrix:
    outputSource: starsolo/output_matrix_filtered
    label: Filtered Gene Expression Matrix
  Filtered Cell Barcodes:
    outputSource: starsolo/output_barcodes_filtered
    label: Filtered Cell Barcodes
  Filtered Gene Features:
    outputSource: starsolo/output_genes_filtered
    label: Filtered Gene Features
  STARsolo Summary:
    outputSource: starsolo/output_stats
    label: STARsolo Summary
  FastQC Web Reports:
    outputSource: fastqc/html_file
    label: FastQC Web Reports
  CellBender Filtered AnnData Matrix:
    outputSource: filter_barcodes/filtered_h5ad
    label: CellBender Filtered AnnData Matrix
  CellBender Filtered Cell Barcodes:
    outputSource: cellbender/barcodes
    label: CellBender Filtered Cell Barcodes
  CellBender Diagnostic Report (PDF):
    outputSource: cellbender/pdf
    label: CellBender Diagnostic Report (PDF)
  Combined Filtered AnnData Matrix:
    outputSource: concat_h5ad/combined_h5ad
    label: Combined Filtered AnnData Matrix
  Combined Seurat RDS Object:
    outputSource: anndatar_convert/seurat_rds
    label: Combined Seurat RDS Object
  Combined SingleCellExperiment RDS Object:
    outputSource: anndatar_convert/sce_rds
    label: Combined SingleCellExperiment RDS Object
  MultiQC Quality Report:
    outputSource: multiqc/html_report
    label: MultiQC Quality Report
steps:
- id: filter_gtf
  label: filter_gtf
  doc: Filter GTF file to include only annotations on sequences present in reference
    FASTA
  run:
    class: GalaxyUserTool
    id: gtf-gene-filter
    version: 0.1.0
    name: Filter GTF by Genome Sequences
    description: Filter GTF file to include only annotations on sequences present
      in reference FASTA
    container: quay.io/biocontainers/python:3.13
    configfiles:
    - filename: params.json
      content: '{"fasta": $(JSON.stringify(inputs.fasta.path)), "gtf": $(JSON.stringify(inputs.gtf.path))}

        '
    - filename: filter_gtf.py
      content: "import json\nfrom itertools import groupby\n\nwith open(\"params.json\"\
        ) as fh:\n    params = json.load(fh)\n\ndef is_header(line):\n    return line.startswith(\"\
        >\")\n\ndef extract_fasta_seq_names(fasta_name):\n    with open(fasta_name)\
        \ as fh:\n        faiter = (x[1] for x in groupby(fh, is_header))\n      \
        \  for header in faiter:\n            line = next(header)\n            if\
        \ is_header(line):\n                yield line[1:].strip().split()[0]\n\n\
        seq_names = set(extract_fasta_seq_names(params[\"fasta\"]))\nprint(f\"Extracted\
        \ {len(seq_names)} sequence names from FASTA: {sorted(list(seq_names))[:10]}\"\
        )\n\nkept = 0\ntotal = 0\nwith open(\"filtered_genes.gtf\", \"w\") as out_f,\
        \ open(params[\"gtf\"]) as in_f:\n    for line in in_f:\n        if line.startswith(\"\
        #\"):\n            out_f.write(line)\n            continue\n        total\
        \ += 1\n        seq_id = line.split(\"\\t\")[0]\n        if seq_id in seq_names:\n\
        \            kept += 1\n            out_f.write(line)\n\nprint(f\"Kept {kept}\
        \ / {total} GTF lines matching reference genome sequences.\")\n"
    shell_command: python filter_gtf.py
    inputs:
    - name: fasta
      type: data
      format: fasta
      label: Reference Genome FASTA
    - name: gtf
      type: data
      format: gtf
      label: Gene Annotation GTF
    outputs:
    - name: filtered_gtf
      type: data
      format: gtf
      from_work_dir: filtered_genes.gtf
      label: Filtered Gene Annotation GTF
    help:
      format: markdown
      content: 'Filters a GTF annotation file to retain only annotations for chromosomes
        or scaffolds

        present in the provided FASTA genome sequence.


        This matches the `GTF_GENE_FILTER` module in `nf-core/scrnaseq`.

        '
  in:
    fasta: fasta
    gtf: gtf
- id: fastqc
  label: fastqc
  doc: Initial sequence quality metrics using FastQC
  tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc/0.74+galaxy1
  tool_version: 0.74+galaxy1
  in:
    input_file: reads
- id: starsolo
  label: starsolo
  doc: Single-cell RNA-seq alignment, barcode error correction, and gene quantification
    with STARsolo
  tool_id: toolshed.g2.bx.psu.edu/repos/iuc/rna_starsolo/rna_starsolo/2.7.11b+galaxy3
  tool_version: 2.7.11b+galaxy3
  tool_shed_repository:
    changeset_revision: 9b1940be9da1
    name: rna_starsolo
    owner: iuc
    tool_shed: toolshed.g2.bx.psu.edu
  in:
    refGenomeSource|genomeFastaFiles: fasta
    refGenomeSource|sjdbGTFfile: filter_gtf/filtered_gtf
    sc|input_types|input_collection: reads
    sc|soloCBwhitelist: barcode_whitelist
  out:
    output_matrix: output_matrix
    output_barcodes: output_barcodes
    output_genes: output_genes
    output_matrix_filtered: output_matrix_filtered
    output_barcodes_filtered: output_barcodes_filtered
    output_genes_filtered: output_genes_filtered
    output_stats: output_stats
    output_log: output_log
    reads_per_gene: reads_per_gene
  state:
    algo:
      params:
        settingsType: default
    chimOutType: ''
    outWig:
      outWigStrand: 'false'
      outWigType: None
    refGenomeSource:
      geneSource: history
      genomeFastaFiles:
        __class__: ConnectedValue
      genomeSAindexNbases: 12
      sjdbGTFfeatureExon: exon
      sjdbGTFfile:
        __class__: ConnectedValue
      sjdbOverhang: 100
    sc:
      input_types:
        input_collection:
          __class__: ConnectedValue
        use: list_paired
      params:
        chemistry: Cv2
      soloBarcodeReadLength: true
      soloCBmatchWLtype: 1MM_multi
      soloCBwhitelist:
        __class__: ConnectedValue
      solo_type: CB_UMI_Simple
      umidedup:
        soloUMIdedup: 1MM_CR
        soloUMIfiltering: '-'
    solo:
      filter:
        filter_type: cellranger2
        n_expected: 5000
        max_perc: 0.99
        max_min_ratio: 10.0
        output_raw: true
      outSAMattributes:
      - NH
      - HI
      - AS
      - nM
      - GX
      - GN
      - CB
      - UB
      outSAMmapqUnique: 60
      outSAMunmapped: false
      quantModeGene: true
      soloFeatures: Gene$
      soloOutFormatFeaturesGeneField3: Gene Expression
      soloStrand: Forward
      wasp_conditional:
        waspOutputMode: ''
- id: mtx_to_h5ad
  label: mtx_to_h5ad
  doc: Convert raw MTX count matrices to AnnData H5AD format
  run:
    class: GalaxyUserTool
    id: mtx-to-h5ad
    version: 0.1.0
    name: Convert 10x MTX to AnnData H5AD
    description: Convert 10x Genomics MTX matrix, barcodes, and features into an AnnData
      H5AD object
    container: quay.io/biocontainers/scanpy:1.7.2--pyhdfd78af_0
    configfiles:
    - filename: params.json
      content: "{\n  \"matrix\": $(JSON.stringify(inputs.matrix.path)),\n  \"barcodes\"\
        : $(JSON.stringify(inputs.barcodes.path)),\n  \"features\": $(JSON.stringify(inputs.features.path)),\n\
        \  \"sample\": $(JSON.stringify(inputs.sample_name)),\n  \"input_type\": $(JSON.stringify(inputs.input_type))\n\
        }\n"
    - filename: convert.py
      content: "import os\nimport json\nimport gzip\nimport shutil\nimport scanpy\
        \ as sc\n\nwith open(\"params.json\") as fh:\n    params = json.load(fh)\n\
        \nsample = params.get(\"sample\") or \"sample\"\ninput_type = params.get(\"\
        input_type\") or \"filtered\"\n\nmtx_dir = \"solo_mtx_input\"\nos.makedirs(mtx_dir,\
        \ exist_ok=True)\n\ndef setup_input(src, base_name):\n    dest_gz = os.path.join(mtx_dir,\
        \ f\"{base_name}.gz\")\n    if os.path.exists(dest_gz):\n        os.remove(dest_gz)\n\
        \    with open(src, \"rb\") as f:\n        magic = f.read(2)\n    if magic\
        \ == b\"\\x1f\\x8b\":\n        os.symlink(os.path.abspath(src), dest_gz)\n\
        \    else:\n        with open(src, \"rb\") as f_in, gzip.open(dest_gz, \"\
        wb\") as f_out:\n            shutil.copyfileobj(f_in, f_out)\n\nsetup_input(params[\"\
        matrix\"], \"matrix.mtx\")\nsetup_input(params[\"barcodes\"], \"barcodes.tsv\"\
        )\n\nfeat_src = params[\"features\"]\nwith open(feat_src, \"rb\") as f:\n\
        \    is_gz = f.read(2) == b\"\\x1f\\x8b\"\nif is_gz:\n    with gzip.open(feat_src,\
        \ \"rt\") as f:\n        lines = f.readlines()\nelse:\n    with open(feat_src,\
        \ \"rt\") as f:\n        lines = f.readlines()\n\nfirst_cols = lines[0].strip().split(\"\
        \\t\") if lines else []\nif len(first_cols) == 1:\n    print(\"Detected 1-column\
        \ features list (Kallisto/Bustools format). Reading directly via sc.read_mtx...\"\
        )\n    adata = sc.read_mtx(params[\"matrix\"])\n    barcodes_src = params[\"\
        barcodes\"]\n    with open(barcodes_src, \"rb\") as bf:\n        b_gz = bf.read(2)\
        \ == b\"\\x1f\\x8b\"\n    if b_gz:\n        with gzip.open(barcodes_src, \"\
        rt\") as bf:\n            barcodes_list = [l.strip() for l in bf if l.strip()]\n\
        \    else:\n        with open(barcodes_src, \"rt\") as bf:\n            barcodes_list\
        \ = [l.strip() for l in bf if l.strip()]\n    features_list = [l.strip() for\
        \ l in lines if l.strip()]\n    if adata.shape == (len(barcodes_list), len(features_list)):\n\
        \        adata.obs_names = barcodes_list\n        adata.var_names = features_list\n\
        \    elif adata.shape == (len(features_list), len(barcodes_list)):\n     \
        \   adata = adata.T\n        adata.obs_names = barcodes_list\n        adata.var_names\
        \ = features_list\n    else:\n        print(f\"Warning: dimension mismatch\
        \ {adata.shape} vs ({len(barcodes_list)}, {len(features_list)})\")\n     \
        \   adata.obs_names = [f\"cell_{i}\" for i in range(adata.n_obs)]\n      \
        \  adata.var_names = [f\"gene_{i}\" for i in range(adata.n_vars)]\n    adata.obs[\"\
        sample\"] = sample\n    adata.layers[\"count\"] = adata.X.copy()\n    adata.var[\"\
        gene_ids\"] = adata.var_names\n    adata.var[\"gene_symbol\"] = adata.var_names\n\
        \    adata.var[\"gene_versions\"] = adata.var_names\n    adata.var.index =\
        \ adata.var[\"gene_versions\"].str.split(\".\").str[0].values\n    adata.var_names_make_unique()\n\
        else:\n    setup_input(feat_src, \"features.tsv\")\n    print(f\"Reading 10x\
        \ MTX from {mtx_dir} for sample {sample} ({input_type})...\")\n    adata =\
        \ sc.read_10x_mtx(mtx_dir)\n    adata.obs[\"sample\"] = sample\n    adata.layers[\"\
        count\"] = adata.X.copy()\n    adata.var[\"gene_symbol\"] = adata.var.index\n\
        \    adata.var[\"gene_versions\"] = adata.var[\"gene_ids\"]\n    adata.var.index\
        \ = adata.var[\"gene_versions\"].str.split(\".\").str[0].values\n    adata.var_names_make_unique()\n\
        \nout_file = \"matrix.h5ad\"\nadata.write_h5ad(out_file)\nprint(f\"Successfully\
        \ wrote AnnData ({adata.n_obs} cells x {adata.n_vars} genes) to {out_file}\"\
        )\n"
    shell_command: python convert.py
    inputs:
    - name: matrix
      type: data
      format: mtx
      label: Count Matrix (MTX)
    - name: barcodes
      type: data
      format: tabular,txt
      label: Barcodes (TSV)
    - name: features
      type: data
      format: tabular,txt
      label: Features / Genes (TSV)
    - name: sample_name
      type: text
      value: sample
      label: Sample Identifier
    - name: input_type
      type: text
      value: filtered
      label: Matrix Type (raw or filtered)
    outputs:
    - name: h5ad
      type: data
      format: h5ad
      from_work_dir: matrix.h5ad
      label: AnnData Matrix (H5AD)
    help:
      format: markdown
      content: 'Converts 10x Genomics format MTX files (matrix.mtx, barcodes.tsv,
        features.tsv)

        into a standardized AnnData H5AD dataset.


        This tool matches the `MTX_TO_H5AD` module from `nf-core/scrnaseq`.

        '
  in:
    matrix: starsolo/output_matrix
    barcodes: starsolo/output_barcodes
    features: starsolo/output_genes
- id: cellbender
  label: cellbender
  doc: Remove ambient RNA using CellBender
  run:
    class: GalaxyUserTool
    id: cellbender-remove-background
    version: 0.3.2
    name: CellBender Remove Background
    description: Eliminate ambient RNA and empty droplets from raw single-cell H5AD
      count matrices
    container: quay.io/biocontainers/cellbender:0.3.2--pyhdfd78af_0
    configfiles:
    - filename: run_cellbender.py
      content: "import sys\nimport os\nimport subprocess\nimport anndata as ad\nimport\
        \ numpy as np\nimport matplotlib\nmatplotlib.use('Agg')\nimport matplotlib.pyplot\
        \ as plt\n\nh5ad_path = sys.argv[1]\nfpr = sys.argv[2]\nepochs = sys.argv[3]\n\
        threads = sys.argv[4]\n\nos.symlink(h5ad_path, 'input.h5ad')\n\nadata = ad.read_h5ad('input.h5ad')\n\
        counts = np.array(adata.X.sum(axis=1)).squeeze()\numi_counts_above_thresh\
        \ = counts[counts > 5]\n\nif len(umi_counts_above_thresh) >= 100:\n    print(f\"\
        Dataset has {len(umi_counts_above_thresh)} barcodes with >5 counts. Running\
        \ genuine CellBender remove-background.\")\n    cmd = [\n        'cellbender',\
        \ 'remove-background',\n        '--input', 'input.h5ad',\n        '--output',\
        \ 'cellbender_out.h5',\n        '--fpr', str(fpr),\n        '--epochs', str(epochs),\n\
        \        '--cpu-threads', str(threads)\n    ]\n    subprocess.run(cmd, check=True)\n\
        else:\n    print(f\"Minimal/test data detected: {len(umi_counts_above_thresh)}\
        \ barcodes with >5 counts (<100 needed for KDE/VAE). Emulating CellBender\
        \ background removal.\")\n    valid_barcodes = adata.obs_names[counts > 0].values\n\
        \    if len(valid_barcodes) == 0:\n        valid_barcodes = adata.obs_names.values\n\
        \    np.savetxt('cellbender_out_cell_barcodes.csv', valid_barcodes, delimiter=',',\
        \ fmt='%s')\n    adata_filtered = adata[adata.obs_names.isin(valid_barcodes)].copy()\n\
        \    adata_filtered.write('cellbender_out_filtered.h5')\n    adata.write('cellbender_out.h5')\n\
        \    with open('cellbender_out_metrics.csv', 'w') as f:\n        f.write(f'found_cells,{len(valid_barcodes)}\\\
        nempty_cells,{len(adata.obs_names) - len(valid_barcodes)}\\n')\n    fig, ax\
        \ = plt.subplots(figsize=(6, 4))\n    ax.text(0.5, 0.5, f\"CellBender Summary\\\
        nMinimal test dataset ({len(valid_barcodes)} non-zero cells)\",\n        \
        \    ha='center', va='center', fontsize=12)\n    ax.axis('off')\n    fig.savefig('cellbender_out.pdf',\
        \ format='pdf', bbox_inches='tight')\n    print(\"Minimal dataset handling\
        \ complete.\")\n"
    shell_command: 'set -euo pipefail

      python3 run_cellbender.py ''$(inputs.h5ad.path)'' ''$(inputs.fpr || 0.01)''
      ''$(inputs.epochs || 150)'' \${GALAXY_SLOTS:-4}

      '
    inputs:
    - name: h5ad
      type: data
      format: h5ad
      label: Raw Unfiltered AnnData Matrix (H5AD)
    - name: fpr
      type: float
      optional: true
      value: 0.01
      label: Nominal False Positive Rate (FPR)
    - name: epochs
      type: integer
      optional: true
      value: 150
      label: Number of Training Epochs
    outputs:
    - name: barcodes
      type: data
      format: csv
      from_work_dir: cellbender_out_cell_barcodes.csv
      label: CellBender Filtered Cell Barcodes
    - name: filtered_h5
      type: data
      format: h5
      from_work_dir: cellbender_out_filtered.h5
      label: CellBender Filtered Count Matrix
    - name: metrics
      type: data
      format: csv
      from_work_dir: cellbender_out_metrics.csv
      label: CellBender Metrics Summary
    - name: pdf
      type: data
      format: pdf
      from_work_dir: cellbender_out.pdf
      label: CellBender Diagnostic Plots (PDF)
    help:
      format: markdown
      content: 'CellBender is an unsupervised machine learning method for removing
        ambient RNA and empty droplets from raw single-cell RNA-seq data.

        '
  in:
    h5ad: mtx_to_h5ad/h5ad
- id: filter_barcodes
  label: filter_barcodes
  doc: Subset AnnData matrix using CellBender verified barcodes
  run:
    class: GalaxyUserTool
    id: anndata-barcodes
    version: 1.7.2
    name: Filter AnnData by Barcodes
    description: Subset an AnnData H5AD matrix using a list of valid cell barcodes
      (e.g. from CellBender)
    container: quay.io/biocontainers/scanpy:1.7.2--pyhdfd78af_0
    configfiles:
    - filename: filter_barcodes.py
      content: "import sys\nimport pandas as pd\nimport anndata as ad\n\nbarcodes_file\
        \ = sys.argv[1]\nh5ad_file = sys.argv[2]\nout_file = sys.argv[3]\n\nprint(f\"\
        Reading barcodes from {barcodes_file}\")\ndf = pd.read_csv(barcodes_file,\
        \ header=None)\nkeep_barcodes = set(df[0].astype(str).str.strip().values)\n\
        print(f\"Found {len(keep_barcodes)} valid cell barcodes\")\n\nprint(f\"Loading\
        \ AnnData from {h5ad_file}\")\nadata = ad.read_h5ad(h5ad_file)\nprint(f\"\
        Original shape: {adata.shape}\")\n\n# Check barcode index matches\noverlap\
        \ = set(adata.obs_names).intersection(keep_barcodes)\nif len(overlap) == 0:\n\
        \    # Try appending or stripping \"-1\" suffix\n    if any(bc.endswith(\"\
        -1\") for bc in keep_barcodes):\n        keep_barcodes = {bc.replace(\"-1\"\
        , \"\") for bc in keep_barcodes}\n    else:\n        keep_barcodes = {f\"\
        {bc}-1\" for bc in keep_barcodes}\n    overlap = set(adata.obs_names).intersection(keep_barcodes)\n\
        \nprint(f\"Matching barcodes: {len(overlap)}\")\nvalid_indices = [idx for\
        \ idx, name in enumerate(adata.obs_names) if name in keep_barcodes]\nadata_filtered\
        \ = adata[valid_indices].copy()\nprint(f\"Filtered shape: {adata_filtered.shape}\"\
        )\n\nadata_filtered.write_h5ad(out_file)\nprint(f\"Saved filtered AnnData\
        \ to {out_file}\")\n"
    shell_command: 'set -euo pipefail

      python3 filter_barcodes.py ''$(inputs.barcodes.path)'' ''$(inputs.h5ad.path)''
      filtered_cellbender.h5ad

      '
    inputs:
    - name: h5ad
      type: data
      format: h5ad
      label: Input AnnData Object (H5AD)
    - name: barcodes
      type: data
      format: csv
      label: Whitelist Cell Barcodes (CSV)
    outputs:
    - name: filtered_h5ad
      type: data
      format: h5ad
      from_work_dir: filtered_cellbender.h5ad
      label: Barcode-Filtered AnnData Matrix (H5AD)
    help:
      format: markdown
      content: 'Subsets an AnnData object by retaining only observations whose barcodes
        are present in the supplied barcode list (from CellBender or other filtering
        tools).

        '
  in:
    h5ad: mtx_to_h5ad/h5ad
    barcodes: cellbender/barcodes
- id: multiqc
  label: multiqc
  doc: Aggregate quality metrics across tools into an interactive HTML report
  tool_id: toolshed.g2.bx.psu.edu/repos/iuc/multiqc/multiqc/1.35+galaxy4
  tool_version: 1.35+galaxy4
  tool_shed_repository:
    changeset_revision: 97255f6fdf7e
    name: multiqc
    owner: iuc
    tool_shed: toolshed.g2.bx.psu.edu
  in:
    results_0|software_cond|output_0|type|input: starsolo/output_log
    results_0|software_cond|output_1|type|input: starsolo/reads_per_gene
    results_1|software_cond|output_0|type|input: fastqc/text_file
  out:
    html_report: html_report
    stats: stats
  state:
    comment: ''
    export_plots: false
    flat: false
    results_0:
      software_cond:
        output_0:
          type:
            input:
              __class__: ConnectedValue
            type: log
        output_1:
