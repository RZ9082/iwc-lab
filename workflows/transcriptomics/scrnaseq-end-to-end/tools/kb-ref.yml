class: GalaxyUserTool
id: kb-ref
version: "0.28.2"
name: Kallisto-Bustools Reference
description: Generate kallisto index and transcript-to-gene mappings from genome FASTA and GTF
container: quay.io/biocontainers/kb-python:0.28.2--pyhdfd78af_2
shell_command: |
  set -euo pipefail
  kb ref \
    -i kb_ref_out.idx \
    -g t2g.txt \
    -f1 cdna.fa \
    --workflow '$(inputs.workflow_mode)' \
    '$(inputs.fasta.path)' \
    '$(inputs.gtf.path)'
inputs:
  - name: fasta
    type: data
    format: fasta
    label: Genome Reference FASTA
  - name: gtf
    type: data
    format: gtf
    label: Gene Annotation GTF
  - name: workflow_mode
    type: select
    default: standard
    label: Workflow Mode
    options:
      - [Standard (mRNA expression), standard]
      - [Lamanno (RNA velocity), lamanno]
      - [Nucleus (Single-nuclei RNA-seq), nucleus]
outputs:
  - name: index
    type: data
    format: binary
    from_work_dir: kb_ref_out.idx
    label: Kallisto Index (.idx)
  - name: t2g
    type: data
    format: tabular
    from_work_dir: t2g.txt
    label: Transcript-to-Gene Mapping (t2g.txt)
  - name: cdna
    type: data
    format: fasta
    from_work_dir: cdna.fa
    label: Extracted cDNA FASTA
help: |
  Builds a kallisto index and transcript-to-gene mapping (t2g) required for single-cell quantification with kb count.
