class: GalaxyUserTool
id: kb-count
version: "0.28.2"
name: Kallisto-Bustools Count
description: Quantify single-cell RNA-seq FASTQ reads using kallisto and bustools
container: quay.io/biocontainers/kb-python:0.28.2--pyhdfd78af_2
configfiles:
  - filename: params.json
    content: |
      {
        "reads": $(JSON.stringify(inputs.reads)),
        "index": $(JSON.stringify(inputs.index.path)),
        "t2g": $(JSON.stringify(inputs.t2g.path)),
        "technology": $(JSON.stringify(inputs.technology)),
        "workflow_mode": $(JSON.stringify(inputs.workflow_mode))
      }
  - filename: run_kb.py
    content: |
      import os
      import sys
      import json
      import glob
      import shutil
      import subprocess

      with open("params.json") as fh:
          params = json.load(fh)

      reads = params.get("reads")
      paths = []
      def find_paths(obj):
          if isinstance(obj, str):
              if obj.startswith("/") or ".dat" in obj or "fastq" in obj:
                  paths.append(obj)
          elif isinstance(obj, dict):
              if "forward" in obj and "reverse" in obj:
                  find_paths(obj["forward"])
                  find_paths(obj["reverse"])
              elif "1" in obj and "2" in obj:
                  find_paths(obj["1"])
                  find_paths(obj["2"])
              elif "path" in obj and isinstance(obj["path"], str):
                  paths.append(obj["path"])
              else:
                  for k in sorted(obj.keys()):
                      find_paths(obj[k])
          elif isinstance(obj, list):
              for v in obj:
                  find_paths(v)
      find_paths(reads)
      fwd = paths[0] if len(paths) > 0 else None
      rev = paths[1] if len(paths) > 1 else None

      if not fwd or not rev:
          print(f"Error: Unable to identify forward and reverse read paths from input: {reads}", file=sys.stderr)
          sys.exit(1)

      idx = params["index"]
      t2g = params["t2g"]
      tech = params.get("technology") or "10XV2"
      wf = params.get("workflow_mode") or "standard"
      slots = os.environ.get("GALAXY_SLOTS", "4")

      cmd = ["kb", "count", "-t", str(slots), "-i", idx, "-g", t2g, "-x", tech, "--workflow", wf, "-o", "output_counts", fwd, rev]
      print("Running kb count:", " ".join(cmd))
      res = subprocess.run(cmd)
      if res.returncode != 0:
          sys.exit(res.returncode)

      os.makedirs("out_solo/raw", exist_ok=True)
      os.makedirs("out_solo/filtered", exist_ok=True)

      for pattern, dst in [
          ("output_counts/counts_unfiltered/*.mtx", "out_solo/raw/matrix.mtx"),
          ("output_counts/counts_unfiltered/*.barcodes.txt", "out_solo/raw/barcodes.tsv"),
          ("output_counts/counts_unfiltered/*.genes.txt", "out_solo/raw/features.tsv"),
          ("output_counts/counts_filtered/*.mtx", "out_solo/filtered/matrix.mtx"),
          ("output_counts/counts_filtered/*.barcodes.txt", "out_solo/filtered/barcodes.tsv"),
          ("output_counts/counts_filtered/*.genes.txt", "out_solo/filtered/features.tsv")
      ]:
          matches = glob.glob(pattern)
          if matches:
              shutil.copyfile(matches[0], dst)
shell_command: |
  set -euo pipefail
  python3 run_kb.py
inputs:
  - name: reads
    type: data_collection
    collection_type: paired
    label: Paired Single-Cell Reads (Read 1 Barcode/UMI, Read 2 cDNA)
  - name: index
    type: data
    format: binary
    label: Kallisto Index (.idx)
  - name: t2g
    type: data
    format: tabular
    label: Transcript-to-Gene Mapping (t2g.txt)
  - name: technology
    type: text
    value: 10XV2
    label: Single-Cell Technology / Chemistry
  - name: workflow_mode
    type: text
    value: standard
    label: Workflow Mode
outputs:
  - name: raw_matrix
    type: data
    format: mtx
    from_work_dir: out_solo/raw/matrix.mtx
    label: Raw Count Matrix (MTX)
  - name: raw_barcodes
    type: data
    format: tsv
    from_work_dir: out_solo/raw/barcodes.tsv
    label: Raw Cell Barcodes (TSV)
  - name: raw_features
    type: data
    format: tsv
    from_work_dir: out_solo/raw/features.tsv
    label: Raw Gene Features (TSV)
  - name: filtered_matrix
    type: data
    format: mtx
    from_work_dir: out_solo/filtered/matrix.mtx
    label: Filtered Count Matrix (MTX)
    optional: true
  - name: filtered_barcodes
    type: data
    format: tsv
    from_work_dir: out_solo/filtered/barcodes.tsv
    label: Filtered Cell Barcodes (TSV)
    optional: true
  - name: filtered_features
    type: data
    format: tsv
    from_work_dir: out_solo/filtered/features.tsv
    label: Filtered Gene Features (TSV)
    optional: true
help: |
  Quantifies single-cell RNA-seq FASTQ reads into gene expression matrices using kb count.
