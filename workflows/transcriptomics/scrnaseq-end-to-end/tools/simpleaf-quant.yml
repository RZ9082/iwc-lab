class: GalaxyUserTool
id: simpleaf-quant
version: "0.19.5"
name: Simpleaf Quant
description: Quantify single-cell RNA-seq FASTQ reads using piscem/salmon mapping and alevin-fry
container: quay.io/biocontainers/simpleaf:0.19.5--ha6fb395_0
shell_command: |
  set -euo pipefail
  export ALEVIN_FRY_HOME="$PWD/af_home"
  mkdir -p "$ALEVIN_FRY_HOME"
  simpleaf set-paths

  # Unpack index archive
  mkdir -p af_index
  tar -xzf '$(inputs.index_archive.path)' -C af_index

  # Run simpleaf quant
  simpleaf quant \
    --threads \${GALAXY_SLOTS:-4} \
    --index af_index/index \
    --t2g-map '$(inputs.t2g.path)' \
    --chemistry '$(inputs.chemistry)' \
    --reads1 '$(inputs.reads.forward.path)' \
    --reads2 '$(inputs.reads.reverse.path)' \
    --unfiltered-pl '$(inputs.whitelist.path)' \
    --resolution '$(inputs.resolution)' \
    --anndata-out \
    --output af_quant_out

  # Extract AnnData or MTX
  mkdir -p out_quants
  find af_quant_out -name "*.h5ad" -exec cp {} out_quants/quants.h5ad \;
  find af_quant_out -name "quants_mat.mtx" -exec cp {} out_quants/quants_mat.mtx \; 2>/dev/null || true
  find af_quant_out -name "quants_mat_rows.txt" -exec cp {} out_quants/quants_mat_rows.txt \; 2>/dev/null || true
  find af_quant_out -name "quants_mat_cols.txt" -exec cp {} out_quants/quants_mat_cols.txt \; 2>/dev/null || true
inputs:
  - name: reads
    type: data_collection
    collection_type: paired
    label: Paired Single-Cell Reads (Read 1 Barcode/UMI, Read 2 cDNA)
  - name: index_archive
    type: data
    format: tar
    label: Simpleaf Index Archive (.tar.gz)
  - name: t2g
    type: data
    format: tabular
    label: Simpleaf Transcript-to-Gene Mapping (t2g.tsv)
  - name: whitelist
    type: data
    format: txt
    label: Barcode Whitelist
  - name: chemistry
    type: select
    default: 10xv2
    label: Chemistry / Protocol
    options:
      - [10x Chromium v2, 10xv2]
      - [10x Chromium v3, 10xv3]
      - [Drop-seq, dropseq]
  - name: resolution
    type: select
    default: cr-like
    label: UMI Resolution Strategy
    options:
      - [Cell Ranger Like (cr-like), cr-like]
      - [Parsimony (parsimony), parsimony]
      - [Exact (trivial), trivial]
outputs:
  - name: h5ad
    type: data
    format: h5ad
    from_work_dir: out_quants/quants.h5ad
    label: Simpleaf AnnData Matrix (H5AD)
help: |
  Performs single-cell mapping and quantification using Piscem and Alevin-fry via the Simpleaf wrapper.
