class: GalaxyUserTool
id: simpleaf-quant
version: 0.19.5
name: Simpleaf Quant
description: Quantify single-cell RNA-seq FASTQ reads using piscem/salmon mapping and alevin-fry
container: quay.io/biocontainers/simpleaf:0.19.5--ha6fb395_0
configfiles:
- filename: params.json
  content: |
    {
      "reads": $(JSON.stringify(inputs.reads)),
      "index_archive": $(JSON.stringify(inputs.index_archive.path)),
      "t2g": $(JSON.stringify(inputs.t2g.path)),
      "whitelist": $(JSON.stringify(inputs.whitelist.path)),
      "chemistry": $(JSON.stringify(inputs.chemistry)),
      "resolution": $(JSON.stringify(inputs.resolution))
    }
- filename: run_quant.sh
  content: |
    set -euo pipefail

    INDEX_ARCHIVE=$(sed -n 's/.*"index_archive"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' params.json)
    T2G=$(sed -n 's/.*"t2g"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' params.json)
    WHITELIST=$(sed -n 's/.*"whitelist"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' params.json)
    CHEMISTRY=$(sed -n 's/.*"chemistry"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' params.json)
    RESOLUTION=$(sed -n 's/.*"resolution"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' params.json)
    [ -z "$CHEMISTRY" ] && CHEMISTRY="10xv2"
    [ -z "$RESOLUTION" ] && RESOLUTION="cr-like"

    READS=($(grep -o '/[^"]*' params.json | grep -v "$INDEX_ARCHIVE" | grep -v "$T2G" | grep -v "$WHITELIST" | sort -u))
    if [ ${#READS[@]} -lt 2 ]; then
      echo "Error: Could not extract at least 2 read paths from params.json" >&2
      cat params.json >&2
      exit 1
    fi
    FWD="${READS[0]}"
    REV="${READS[1]}"
    echo "Found forward read: $FWD"
    echo "Found reverse read: $REV"

    export ALEVIN_FRY_HOME="$(pwd)/af_home"
    mkdir -p "$ALEVIN_FRY_HOME"
    simpleaf set-paths

    mkdir -p af_index
    tar -xzf "$INDEX_ARCHIVE" -C af_index

    SLOTS="${GALAXY_SLOTS:-4}"

    mkdir -p af_quant_out
    simpleaf quant \
      --threads "$SLOTS" \
      --index af_index/index \
      --t2g-map "$T2G" \
      --chemistry "$CHEMISTRY" \
      --reads1 "$FWD" \
      --reads2 "$REV" \
      --unfiltered-pl "$WHITELIST" \
      --resolution "$RESOLUTION" \
      --anndata-out \
      --output af_quant_out

    mkdir -p out_quants
    find af_quant_out -name "*.h5ad" -exec cp {} out_quants/quants.h5ad \;
    if [ ! -f out_quants/quants.h5ad ]; then
      echo "Error: quants.h5ad was not produced by simpleaf quant" >&2
      ls -laR af_quant_out >&2
      exit 1
    fi
    echo "Simpleaf quantification completed successfully."
shell_command: bash run_quant.sh
inputs:
- name: reads
  type: data_collection
  collection_type: paired
  label: Paired Single-Cell Reads (Read 1 Barcode/UMI, Read 2 cDNA)
- name: index_archive
  type: data
  format: tar
  label: Simpleaf Index Archive (.tar.gz)
- name: t2g
  type: data
  format: tabular
  label: Simpleaf Transcript-to-Gene Mapping (t2g.tsv)
- name: whitelist
  type: data
  format: txt
  label: 10x Barcode Whitelist
- name: chemistry
  type: text
  value: 10xv2
  label: Single-Cell Chemistry
- name: resolution
  type: text
  value: cr-like
  label: UMI Resolution Mode (cr-like, trivial, etc.)
outputs:
- name: h5ad
  type: data
  format: h5ad
  from_work_dir: out_quants/quants.h5ad
  label: Simpleaf AnnData Matrix (H5AD)
help:
  format: markdown
  content: |
    Quantifies single-cell RNA-seq FASTQ reads using piscem/salmon mapping and alevin-fry in Simpleaf.
